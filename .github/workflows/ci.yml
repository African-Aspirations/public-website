name: CI
on:
  pull_request:
  push:
    branches: [rebuild, main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://postgres:pg@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci .
      - name: Migrate test database (with Supabase role shim)
        run: |
          psql "$DATABASE_MIGRATION_URL" -f packages/db/test/supabase-shim.sql
          bun --cwd packages/db run migrate
      - name: Seed content is valid
        run: bun --cwd packages/db run seed:check
      - name: DB role permission tests
        run: bun --cwd packages/db test
      - name: Seed test database
        run: |
          bun --cwd packages/db seed/run.ts --allow-missing-images --force
          psql "$DATABASE_MIGRATION_URL" -c "ALTER ROLE web_build LOGIN PASSWORD 'ci'"
      - name: Build public site
        run: bun --cwd apps/web run build
        env:
          DATABASE_URL_WEB_BUILD: postgres://web_build:ci@localhost:5432/postgres
          PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      - name: 14 KB HTML budget
        run: bun scripts/check-budget.ts apps/web/dist
      - name: Layout tests (content width, one h1 per page)
        run: |
          bunx --cwd apps/web playwright install --with-deps chromium
          bun --cwd apps/web run test:e2e
