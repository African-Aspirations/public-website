name: CI
on:
  pull_request:
  push:
    branches: [rebuild, main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_MIGRATION_URL: postgres://postgres:pg@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci .
      - name: Migrate test database (with Supabase role shim)
        run: |
          psql "$DATABASE_MIGRATION_URL" -f packages/db/test/supabase-shim.sql
          bun --cwd packages/db run migrate
      - name: DB role permission tests
        run: bun --cwd packages/db test
      - name: Build public site
        run: bun --cwd apps/web run build
      - name: 14 KB HTML budget
        run: bun scripts/check-budget.ts apps/web/dist
